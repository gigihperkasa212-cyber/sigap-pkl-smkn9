name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'www/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (misal: 2.2.8)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 ──────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Setup Android SDK ─────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Grant execute permission Gradle wrapper ───────────────
      - name: Grant Gradlew permission
        run: chmod +x android/gradlew

      # ── 5. Decode Keystore dari GitHub Secret ────────────────────
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "Keystore decoded OK"

      # ── 6. Bump version dari input (opsional) ────────────────────
      - name: Bump versionName (if provided)
        if: ${{ github.event.inputs.version_name != '' }}
        run: |
          VER="${{ github.event.inputs.version_name }}"
          # Hitung versionCode dari versionName (misal 2.2.8 -> 228)
          CODE=$(echo $VER | tr -d '.' | sed 's/^0*//')
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          echo "Version bumped to $VER (code: $CODE)"

      # ── 7. Read current version ──────────────────────────────────
      - name: Read version
        id: version
        run: |
          VER=$(grep versionName android/app/build.gradle | grep -oP '"\K[^"]+')
          CODE=$(grep versionCode android/app/build.gradle | grep -oP '\d+' | head -1)
          echo "version_name=$VER" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "Build: v$VER ($CODE)"

      # ── 8. Build Release APK ─────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon
        # Catatan: signing sudah dikonfigurasi di build.gradle (hardcoded)
        # Baris -P di atas hanya sebagai override jika ingin ganti keystore

      # ── 9. Rename APK ────────────────────────────────────────────
      - name: Rename APK
        run: |
          VER=${{ steps.version.outputs.version_name }}
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          # Coba nama lain jika tidak ada
          if [ ! -f "$SRC" ]; then
            SRC=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          fi
          DST="SIGAP-PKL-K9-v${VER}.apk"
          cp "$SRC" "$DST"
          echo "APK: $DST ($(du -h $DST | cut -f1))"
          echo "apk_path=$DST" >> $GITHUB_ENV

      # ── 10. Upload APK sebagai artifact ─────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}
          path: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      # ── 11. Create GitHub Release otomatis ──────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "SIGAP PKL K9 v${{ steps.version.outputs.version_name }}"
          body: |
            ## SIGAP PKL K9 — Release v${{ steps.version.outputs.version_name }}

            **Fix yang termasuk:**
            - Sinkronisasi filter Cetak Statistik, Cetak Rekap PDF, dan Cetak Lengkap
            - Filter guru dan bulan kini konsisten di semua menu cetak
            - Penghitungan Hadir (termasuk Pengantaran/Monitoring/Penjemputan) diseragamkan

            **Install:**
            1. Download file APK di bawah
            2. Aktifkan *Install from unknown sources* di HP
            3. Buka file APK dan install

            > versionCode: ${{ steps.version.outputs.version_code }}
          files: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
