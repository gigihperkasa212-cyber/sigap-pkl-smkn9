name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'www/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (misal: 2.2.210)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Validasi secrets tersedia ─────────────────────────────
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 belum diset!"
            echo "Buka: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: Secret KEYSTORE_PASSWORD belum diset!"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ERROR: Secret KEY_ALIAS belum diset!"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: Secret KEY_PASSWORD belum diset!"
            exit 1
          fi
          echo "✅ Semua secrets tersedia"

      # ── 3. Setup JDK 17 ──────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Setup Android SDK ─────────────────────────────────────
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1
          echo "✅ Android SDK siap"

      # ── 5. Grant execute permission Gradle wrapper ───────────────
      - name: Grant Gradlew permission
        run: chmod +x android/gradlew

      # ── 6. Decode Keystore dari GitHub Secret ────────────────────
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          SIZE=$(wc -c < "$KEYSTORE_FILE")
          echo "Keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: Keystore terlalu kecil — KEYSTORE_BASE64 mungkin salah"
            exit 1
          fi
          echo "✅ Keystore decoded OK ($SIZE bytes)"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      # ── 7. Auto bump versionCode berdasarkan run number ──────────
      - name: Auto bump version
        id: version
        run: |
          # Baca versi saat ini dari build.gradle
          CURRENT_VER=$(grep 'versionName' android/app/build.gradle | grep -oP '"\K[^"]+' | head -1)
          CURRENT_CODE=$(grep 'versionCode' android/app/build.gradle | grep -oP '\d+' | head -1)

          # Jika ada input manual, pakai itu
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VER="${{ github.event.inputs.version_name }}"
          else
            # Auto increment patch version: 2.2.208 → 2.2.209
            MAJOR=$(echo $CURRENT_VER | cut -d. -f1)
            MINOR=$(echo $CURRENT_VER | cut -d. -f2)
            PATCH=$(echo $CURRENT_VER | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VER="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # versionCode = kombinasi angka dari versi (misal 2.2.209 → 2209)
          CODE=$(echo $VER | awk -F. '{printf "%d%d%02d", $1, $2, $3}')

          # Update build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle

          echo "version_name=$VER" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "✅ Version: v$VER (code: $CODE)"

      # ── 8. Build Release APK ─────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon --stacktrace
          echo "✅ Build selesai"

      # ── 9. Rename APK ────────────────────────────────────────────
      - name: Rename APK
        run: |
          VER=${{ steps.version.outputs.version_name }}
          SRC=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: APK tidak ditemukan di output folder!"
            find android/app/build/outputs/ -name "*.apk" 2>/dev/null || echo "Tidak ada APK sama sekali"
            exit 1
          fi
          DST="SIGAP-PKL-K9-v${VER}.apk"
          cp "$SRC" "$DST"
          SIZE=$(du -h $DST | cut -f1)
          echo "✅ APK: $DST ($SIZE)"
          echo "apk_name=$DST" >> $GITHUB_ENV

      # ── 10. Upload APK sebagai artifact ─────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}
          path: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      # ── 11. Create GitHub Release otomatis ──────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "SIGAP PKL K9 v${{ steps.version.outputs.version_name }}"
          body: |
            ## SIGAP PKL K9 — Release v${{ steps.version.outputs.version_name }}

            **Download APK:**
            Klik file `.apk` di bawah untuk download dan install.

            **Cara Install:**
            1. Download file APK di bawah
            2. Aktifkan *Instal dari sumber tidak dikenal* di HP
            3. Buka file APK dan install

            ---
            > versionCode: ${{ steps.version.outputs.version_code }}
            > Build: ${{ github.sha }}
          files: SIGAP-PKL-K9-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
