# ============================================================
# SIGAP PKL SMKN 9 — Nginx Config
# Akses hanya melalui: https://103.153.190.69:8443
# Port 80 redirect → https://103.153.190.69:8443
# ============================================================

# Block 1: Port 80 — redirect semua ke https port 8443
server {
    listen 80;
    server_name _;

    # Redirect semua request ke HTTPS port 8443
    return 301 https://103.153.190.69:8443$request_uri;
}

# Block 2: Port 443 SSL — melayani aplikasi SIGAP (diforward dari port 8443 oleh Proxmox)
server {
    listen 443 ssl;
    server_name _;
    root /var/www/html/SIGAP-SMKN9-Official;
    index index.html index.php;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CORS headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # No-cache untuk HTML dan JS utama
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
    location ~* /js/app\.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API PHP
    location ~ ^/api\.php {
        if ($request_method = OPTIONS) { return 204; }
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffering off;
        proxy_buffering off;
        add_header X-Accel-Buffering no;
        client_max_body_size 20M;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location ~ ^/api/(.*)$ {
        if ($request_method = OPTIONS) { return 204; }
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param QUERY_STRING "action=$1&$query_string";
        include fastcgi_params;
        client_max_body_size 20M;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location /tmp_reports/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control no-store;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
